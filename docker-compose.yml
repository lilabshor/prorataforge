version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prorataforge_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CI_ENVIRONMENT: development
      app.baseURL: "http://localhost:8080/"
      database.default.hostname: db
      database.default.database: prorataforge
      database.default.username: prorata
      database.default.password: proratapass
      database.default.DBDriver: MySQLi
      MIDTRANS_SERVER_KEY: "sandbox-secret-dummy-midtrans"
      PAYMENT_GATEWAY: "midtrans"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.0
    container_name: prorataforge_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prorataforge
      MYSQL_USER: prorata
      MYSQL_PASSWORD: proratapass
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "prorata", "-pproratapass"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data:
